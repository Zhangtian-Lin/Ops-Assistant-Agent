name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, for example 0.4.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Verify before release
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt

      - name: Run required verification
        run: python scripts/run_verification.py; python scripts/run_intent_eval.py; python scripts/run_rag_eval.py

      - name: Check release gate
        run: python scripts/check_release.py --tag v${{ inputs.version }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v${{ inputs.version }} --title "v${{ inputs.version }}" --generate-notes
