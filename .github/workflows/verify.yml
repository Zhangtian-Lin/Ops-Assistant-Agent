name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verification:
    name: Windows verification and evals
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt

      - name: Check whitespace and patch integrity
        run: git diff --check HEAD^ HEAD

      - name: Run regression and security verification
        run: python scripts/run_verification.py

      - name: Run deterministic intent evaluation
        run: python scripts/run_intent_eval.py

      - name: Run RAG source-retrieval evaluation
        run: python scripts/run_rag_eval.py

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence-${{ github.run_id }}
          path: reports/*.json
          if-no-files-found: warn
          retention-days: 30
