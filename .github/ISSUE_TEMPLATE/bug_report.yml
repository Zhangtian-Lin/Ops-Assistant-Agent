name: Bug report
description: Report a reproducible defect without including secrets or private logs.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, Windows SIDs, full local paths, approval databases, or raw private documents."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      placeholder: Brief, observable behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Start...\n2. Enter...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Project version
      placeholder: 0.4.0
    validations:
      required: true
